# AI security review of PR diffs (anthropics/claude-code-security-review, MIT).
# Requires repo secret CLAUDE_API_KEY (Settings > Secrets and variables > Actions). No key is stored in this repo.
# Upstream warns the action is not hardened against prompt injection: it only runs for PRs from branches in this repo, not forks.
name: security-review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main @ 2026-02-11
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
