[project]
name = "arthai-health"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["packages/rcm_models", "scripts/gen"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: runs Synthea (needs /workspace/tools; set ARTHAI_SLOW=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/rcm_models", "scripts/gen", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # asserts in tests; random is for synthetic data, not crypto

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/rcm_models", "scripts/gen"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[tool.ruff.lint.isort]
known-first-party = ["arthai_gen", "rcm_models"]
