[project]
name = "arthai-health"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # asserts in tests; random is for synthetic data, not crypto

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
